name: Automated Data Preprocessing

on:
  push:
    branches: [main]
    paths:
      - "namadataset_raw/**"
      - "automate_Alwan-Fauzi.py"
      - ".github/workflows/preprocessing.yml"
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Run automated preprocessing
        run: |
          python automate_Alwan-Fauzi.py --input namadataset_raw/train.csv --output namadataset_preprocessing

      - name: Commit & push preprocessed dataset
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git add namadataset_preprocessing
          git diff --staged --quiet || git commit -m "ci: update preprocessed dataset [skip ci]"
          git push
